<!DOCTYPE html>
<html>
<head>
    <title>Research Agent</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            background: #f5f5f5;
        }
        #chatBox {
            background: white;
            border-radius: 10px;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
        }
        .userMsg {
            background: #d1e7ff;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 8px 0;
            text-align: right;
        }
        .agentMsg {
            background: #eee;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 8px 0;
        }
        #inputArea {
            display: flex;
            margin-top: 10px;
        }
        #userInput {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            margin-left: 10px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Research Assistant Agent</h2>
    <div id="chatBox"></div>

    <div id="inputArea">
        <input type="text" id="userInput" placeholder="Ask me anything..." />
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById("userInput");
            const message = input.value;
            if (!message) return;

            const chatBox = document.getElementById("chatBox");
            chatBox.innerHTML += `<div class="userMsg">${message}</div>`;
            input.value = "";
            chatBox.innerHTML += `<div class="agentMsg" id="loading">Thinking...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            const response = await fetch("http://127.0.0.1:8000/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message, thread_id: "web-chat" })
            });

            const data = await response.json();
            document.getElementById("loading").remove();
            chatBox.innerHTML += `<div class="agentMsg">${data.reply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById("userInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") sendMessage();
        });
    </script>

</body>
</html>
